<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visualizador Concordia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: sans-serif;
    }
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    /* Columna de Flyers (1 parte) */
    .col-flyers {
      flex: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
    }
    .col-flyers img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }
    /* Columna de Calendario (1.8 partes) */
    .col-calendar {
      flex: 1.8;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }
    .dark-calendar {
      filter: invert(0.9) hue-rotate(-290deg) brightness(1.7) contrast(1.4);
      background-color: #000000;
      width: 100%;
      height: 110vh;
      border: none;
      margin-top: -50px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Columna Izquierda: Flyers -->
    <div class="col-flyers">
      <img id="flyer-img" src="" alt="Cargando flyer..." />
    </div>

    <!-- Columna Derecha: Google Calendar -->
    <div class="col-calendar">
      <iframe id="cal-frame" class="dark-calendar" frameborder="0" scrolling="no"></iframe>
    </div>
  </div>

  <script>
    // --- CONFIGURACIÓN DE FLYERS ---
    // Agrega aquí los nombres de las imágenes guardadas en la carpeta /flyers/
    const listaFlyers = [
      "flyers/flyer1.jpg",
      "flyers/flyer2.jpg",
      "flyers/flyer3.png"
    ];

    const baseUrlCal = "https://calendar.google.com/calendar/embed?src=subsecretariadedeportescdia%40gmail.com&ctz=America%2FArgentina%2FCordoba&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0";

    let flyerIndex = 0;
    let ciclo = 0;
    const CICLOS_CALENDARIO = 6; // Refrescar calendario cada 6 ciclos (60 seg)

    const imgElement = document.getElementById('flyer-img');
    const calFrame = document.getElementById('cal-frame');

    function actualizarFlyer() {
      if (listaFlyers.length > 0) {
        if (flyerIndex >= listaFlyers.length) {
          flyerIndex = 0;
        }
        imgElement.src = listaFlyers[flyerIndex];
        flyerIndex++;
      }
    }

    function actualizarCalendario() {
      const timestamp = new Date().getTime();
      calFrame.src = baseUrlCal + "&nocache=" + timestamp;
    }

    // Bucle principal cada 10 segundos
    function mainLoop() {
      if (ciclo % CICLOS_CALENDARIO === 0) {
        actualizarCalendario();
      }
      actualizarFlyer();
      ciclo++;
    }

    // Ejecutar inmediatamente al cargar y luego cada 10 segundos
    mainLoop();
    setInterval(mainLoop, 10000);
  </script>

</body>
</html>
